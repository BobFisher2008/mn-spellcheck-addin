# Mongolian Spellcheck installer configuration (baked into MongolianSpellcheckSetup.exe at build time).
# Leave a value empty until its prerequisite exists; the installer then falls back to
# pilot mode or hides the component. Rebuild with:  npm run build:installer

# Browser extension (Chrome/Edge): PARKED by the owner on 2026-11-06. With "false" the
# installer neither shows Chrome/Edge nor ships the extension. Set "true" to bring it back.
include_browser_extension=false

# Chrome Web Store ID (32 letters a-p) once the extension is published.
# Empty = pilot mode: the installer copies the extension and guides the user through
# chrome://extensions -> Developer mode -> Load unpacked.
chrome_extension_id=

# Microsoft Edge Add-ons ID once published. Empty = pilot mode (same guided steps in Edge).
edge_extension_id=

# HTTPS origin that serves dist/office (e.g. https://spell.example.mn/addin).
# Empty = the Word and Outlook add-ins are not offered (Office requires HTTPS hosting).
addin_base_url=https://bobfisher2008.github.io/mn-spellcheck-addin

# Microsoft Marketplace asset ID of the Word add-in (e.g. WA200001234). When set, Word is
# installed through Microsoft's supported per-user AutoInstallAddins route instead of the
# pilot developer-sideload registry key.
word_marketplace_asset_id=

product_version=0.1.0
